<!-- Robot Icon 32x32 optimized -->
<svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="20" y="25" width="60" height="50" rx="8" fill="#FF6B35" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Robot Eyes -->
  <circle cx="35" cy="45" r="6" fill="#1E40AF"/>
  <circle cx="65" cy="45" r="6" fill="#1E40AF"/>
  <circle cx="35" cy="45" r="3" fill="#FFFFFF"/>
  <circle cx="65" cy="45" r="3" fill="#FFFFFF"/>
  
  <!-- Robot Antenna -->
  <line x1="50" y1="25" x2="50" y2="15" stroke="#1E40AF" stroke-width="2"/>
  <circle cx="50" cy="12" r="3" fill="#FF6B35"/>
  
  <!-- Robot Mouth -->
  <rect x="40" y="58" width="20" height="6" rx="3" fill="#1E40AF"/>
  
  <!-- Robot Body -->
  <rect x="30" y="75" width="40" height="15" rx="3" fill="#1E40AF"/>
</svg>