<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Orange to Teal gradient matching your image -->
    <linearGradient id="rocket-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF8543;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#52C4B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Fire gradient -->
    <linearGradient id="fire-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8543;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1" />
    </linearGradient>
    
    <!-- Hand gradient -->
    <linearGradient id="hand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8543;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="400" cy="400" r="390" fill="#F8F9FA" stroke="none"/>
  
  <!-- Hand/Sun burst in background -->
  <g transform="translate(150, 200)">
    <!-- Hand palm -->
    <ellipse cx="100" cy="150" rx="80" ry="120" fill="url(#hand-gradient)" opacity="0.9"/>
    
    <!-- Hand fingers -->
    <ellipse cx="50" cy="80" rx="25" ry="90" fill="url(#hand-gradient)" transform="rotate(-20 50 80)"/>
    <ellipse cx="85" cy="60" rx="25" ry="100" fill="url(#hand-gradient)" transform="rotate(-10 85 60)"/>
    <ellipse cx="120" cy="55" rx="25" ry="110" fill="url(#hand-gradient)" transform="rotate(5 120 55)"/>
    <ellipse cx="155" cy="70" rx="25" ry="95" fill="url(#hand-gradient)" transform="rotate(15 155 70)"/>
    <ellipse cx="185" cy="100" rx="22" ry="80" fill="url(#hand-gradient)" transform="rotate(25 185 100)"/>
    
    <!-- Thumb -->
    <ellipse cx="40" cy="180" rx="30" ry="70" fill="url(#hand-gradient)" transform="rotate(-45 40 180)"/>
  </g>
  
  <!-- Main rocket body -->
  <g transform="translate(450, 150)">
    <!-- Rocket main body -->
    <path d="M 50 50 L 200 150 L 180 300 L 220 450 L 50 550 L -120 450 L -100 300 L -120 150 Z" 
          fill="url(#rocket-gradient)" 
          stroke="#2C5F2D" 
          stroke-width="4"/>
    
    <!-- Rocket window -->
    <circle cx="50" cy="220" r="60" fill="#FFFFFF" stroke="#2C5F2D" stroke-width="3"/>
    <circle cx="50" cy="220" r="45" fill="#87CEEB" opacity="0.8"/>
    <circle cx="50" cy="220" r="25" fill="#E6F3FF"/>
    
    <!-- Rocket fins -->
    <path d="M -120 450 L -180 520 L -100 500 Z" fill="#2C5F2D"/>
    <path d="M 220 450 L 280 520 L 200 500 Z" fill="#2C5F2D"/>
    
    <!-- Small details on rocket -->
    <rect x="30" y="320" width="40" height="8" rx="4" fill="#2C5F2D" opacity="0.6"/>
    <rect x="30" y="340" width="40" height="8" rx="4" fill="#2C5F2D" opacity="0.6"/>
    <rect x="30" y="360" width="40" height="8" rx="4" fill="#2C5F2D" opacity="0.6"/>
  </g>
  
  <!-- Fire/Exhaust flames -->
  <g transform="translate(450, 700)">
    <!-- Main flame -->
    <path d="M -40 0 L 50 -50 L 140 0 L 50 80 Z" fill="url(#fire-gradient)"/>
    <!-- Side flames -->
    <path d="M -20 -10 L 50 -40 L 80 10 L 50 50 Z" fill="#FF4444" opacity="0.8"/>
    <path d="M 20 -10 L 50 -30 L 120 10 L 50 60 Z" fill="#FF6600" opacity="0.7"/>
  </g>
  
  <!-- Floating particles/dots -->
  <circle cx="120" cy="600" r="12" fill="#FF8543" opacity="0.7"/>
  <circle cx="160" cy="650" r="8" fill="#FF8543" opacity="0.5"/>
  <circle cx="100" cy="680" r="6" fill="#FFB347" opacity="0.6"/>
  
  <circle cx="650" cy="600" r="10" fill="#52C4B0" opacity="0.6"/>
  <circle cx="680" cy="650" r="14" fill="#4A90E2" opacity="0.5"/>
  
  <!-- Motion lines around rocket -->
  <g transform="translate(450, 400)" opacity="0.4">
    <path d="M -200 -50 Q -150 -40 -100 -45" stroke="#FF8543" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -200 0 Q -150 10 -100 5" stroke="#FF8543" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -200 50 Q -150 60 -100 55" stroke="#FF8543" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>